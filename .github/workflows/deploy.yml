name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # The commit of the new customer page that goes live. Changing it on main is the
  # release step (the push to main runs this workflow).
  PUBLIC_REF: 962854dedecdafce4d711cbd6763389404fe4127
  # The commit of the V2 staff app served at /v2/ (opt-in per device, V1 stays the
  # default at /staff). Changing it on main releases a newer V2 staff app.
  STAFF_V2_REF: a51bfb30c472fd2d5e3c0a66518d7e77a4340892

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Build
        env:
          VITE_SPLIT_PUBLIC: "true"
          # "true" shows "Try the new version" in V1 (needs the prod Firestore rules
          # for V2's own collections, docs/ENVIRONMENTS.md on public-prod).
          VITE_OFFER_V2: "true"
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: yarn build

      - name: Copy index.html to 404.html for SPA routing
        run: cp dist/index.html dist/404.html

      - name: Record V1 files the customer page must not touch
        run: sha256sum dist/404.html dist/CNAME > "$RUNNER_TEMP/v1.sha256"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PUBLIC_REF }}
          path: public-v2

      - name: Install customer page dependencies
        working-directory: public-v2
        run: yarn install --frozen-lockfile

      - name: Build customer page
        working-directory: public-v2
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: yarn build:public

      - name: Copy customer page over V1 build
        run: |
          # Only index.html may replace a V1 file.
          clash=$(cd public-v2/dist-public && find . -type f ! -path ./index.html -exec test -e ../../dist/{} \; -print)
          if [ -n "$clash" ]; then echo "Would overwrite V1 files: $clash"; exit 1; fi
          cp -R public-v2/dist-public/. dist/

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.STAFF_V2_REF }}
          path: staff-v2

      - name: Install V2 staff dependencies
        working-directory: staff-v2
        # The checked-out commit tracks a development .env; the build must not read it.
        run: |
          rm -f .env
          yarn install --frozen-lockfile

      - name: Build V2 staff app under /v2/
        working-directory: staff-v2
        env:
          VITE_NODE_ENV: production
          VITE_DEV_BYPASS_AUTH: "false"
          VITE_V1_STAFF_URL: /staff
          VITE_AI_PROXY_URL: https://inktonermoore-ai-proxy.inktonermoore.workers.dev
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: yarn build --base=/v2/

      - name: Copy V2 staff app into /v2/
        env:
          PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        run: |
          test ! -e dist/v2
          mkdir dist/v2
          cp -R staff-v2/dist/. dist/v2/
          # Only the root _redirects and CNAME count; V2's copies would mislead.
          rm -f dist/v2/_redirects dist/v2/CNAME
          # Cloudflare Pages serves the nearest 404.html, so /v2/staff/* opens V2.
          cp dist/v2/index.html dist/v2/404.html
          grep -q '/v2/assets/' dist/v2/index.html
          # The prod Firebase project must be in the bundle, not only the demo fallback.
          test -n "$PROJECT_ID"
          grep -lq -- "\"$PROJECT_ID\"" dist/v2/assets/*.js

      - name: Check V1 files are untouched
        run: |
          sha256sum -c "$RUNNER_TEMP/v1.sha256"
          test -d dist/assets
          # "/" must be the customer page; the staff app there would reload itself forever.
          grep -q 'assets-public/' dist/index.html

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment

      # The same dist/ also goes to ITM's own Cloudflare Pages project. GitHub Pages
      # stays live until the DNS points at Cloudflare and has held for a while.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 73a4f935ed801ea9299664d719bb9180
        run: npx --yes wrangler@3 pages deploy dist --project-name itm-site --branch main --commit-dirty=true
